<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aula — Estrutura Lexical</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* ===== PALETA — do Canva ===== */
    --paper: #FBF3E7;
    --paper-2: #F5E6CE;
    --ink: #000000;
    --ink-soft: #5C4A3D;
    --teal: #572C1C;
    --teal-dark: #401F14;
    --gold: #FFBD59;
    --gold-dark: #DB9C3B;
    --white: #FFFFFF;
    --border: #E3D2B8;
    --err: #B4483A;
    --ok: #2E7D4F;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'IBM Plex Sans',sans-serif; background:var(--paper); color:var(--ink); min-height:100vh; }
  .app { max-width: 900px; margin: 0 auto; padding: 24px 20px 50px; }

  header.top { display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:14px; border-bottom:2px solid var(--ink); padding-bottom:14px; margin-bottom:18px; }
  .title-block h1 { font-family:'Fraunces',serif; font-weight:600; font-size:26px; margin:0 0 4px; letter-spacing:-0.01em; }
  .title-block .topic { color:var(--ink-soft); font-size:13px; }
  .level-badge { display:inline-flex; align-items:center; gap:6px; font-family:'Fraunces',serif; font-weight:600; font-size:14px; padding:6px 13px; border-radius:999px; background:var(--teal); color:var(--white); white-space:nowrap; }

  .setup { background:var(--white); border:1px solid var(--border); border-radius:var(--radius); padding:14px 18px; margin-bottom:18px; }
  .setup summary { cursor:pointer; font-weight:600; font-size:13px; color:var(--teal-dark); list-style:none; display:flex; align-items:center; gap:8px; }
  .setup summary::-webkit-details-marker { display:none; }
  .setup summary::before { content:'▸'; display:inline-block; transition: transform .15s ease; }
  .setup[open] summary::before { transform: rotate(90deg); }
  .setup-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-top:14px; }
  .field label { display:block; font-size:11px; font-weight:600; color:var(--ink-soft); margin-bottom:4px; }
  .field input, .field select, .field textarea { width:100%; padding:8px 9px; border:1px solid var(--border); border-radius:6px; font-family:inherit; font-size:13px; background:var(--paper); color:var(--ink); }
  .mode-toggle { display:flex; border:1px solid var(--border); border-radius:6px; overflow:hidden; }
  .mode-toggle button { flex:1; padding:8px 9px; border:none; background:var(--paper); font-family:inherit; font-size:12px; font-weight:600; color:var(--ink-soft); cursor:pointer; }
  .mode-toggle button.active { background:var(--teal); color:var(--white); }

  /* progress */
  .progress-row { display:flex; align-items:center; gap:6px; margin-bottom:18px; flex-wrap: wrap; }
  .step-dot { flex:1; min-width:18px; height:6px; border-radius:4px; background:var(--border); cursor:pointer; }
  .step-dot.done { background:var(--teal); }
  .step-dot.active { background:var(--gold); }
  .step-label { font-size:12px; color:var(--ink-soft); margin-bottom:14px; display:flex; justify-content:space-between; }
  .step-label b { color:var(--ink); font-family:'Fraunces',serif; }

  .panel { background:var(--white); border:1px solid var(--border); border-radius:10px; padding:28px; min-height:420px; }
  .slide-title { font-family:'Fraunces',serif; font-weight:600; font-size:22px; margin:0 0 4px; }
  .slide-kicker { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--gold-dark); font-weight:600; margin-bottom:6px; }
  .slide-sub { color:var(--ink-soft); font-size:13px; margin-bottom:22px; }

  .turn-indicator { display:inline-flex; align-items:center; gap:8px; font-size:13px; font-weight:600; padding:6px 12px; border-radius:999px; margin-bottom:18px; }
  .turn-a { background:rgba(31,111,92,0.12); color:var(--teal-dark); }
  .turn-b { background:rgba(198,138,46,0.15); color:var(--gold-dark); }
  .turn-dot { width:8px; height:8px; border-radius:50%; background:currentColor; }

  /* nav */
  .nav-row { display:flex; justify-content:space-between; align-items:center; margin-top:22px; }
  .btn { border:none; border-radius:6px; padding:10px 18px; font-family:inherit; font-weight:600; font-size:13px; cursor:pointer; }
  .btn-ghost { background:var(--paper-2); color:var(--ink); border:1px solid var(--border); }
  .btn-primary { background:var(--ink); color:var(--white); }
  .btn:disabled { opacity:.35; cursor:not-allowed; }

  /* warm up */
  .q-list { list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:10px; }
  .q-list li { background:var(--paper); border:1px solid var(--border); border-left:4px solid var(--teal); border-radius:6px; padding:12px 14px; font-size:15px; }

  /* flashcards */
  .flash-wrap { display:flex; flex-direction:column; align-items:center; gap:16px; }
  .flash-progress { font-size:12px; color:var(--ink-soft); }
  .flashcard { width:100%; max-width:320px; height:300px; perspective:1200px; cursor:pointer; }
  .flashcard-inner { position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d; }
  .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }
  .flash-face { position:absolute; inset:0; backface-visibility:hidden; border-radius:12px; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px; border:1px solid var(--border); }
  .flash-front { background:var(--paper-2); flex-direction:column; gap:10px; }
  .flash-icon { font-size:56px; line-height:1; }
  .flash-word { font-family:'Fraunces',serif; font-weight:600; font-size:24px; }
  .flash-back { background:var(--teal); color:var(--white); transform:rotateY(180deg); flex-direction:column; gap:10px; }
  .flash-back .meaning { font-size:16px; line-height:1.5; }
  .flash-back .example { font-style:italic; opacity:.85; font-size:13px; }
  .flash-hint { font-size:11px; color:var(--ink-soft); }
  .flash-nav { border:1px solid var(--border); background:var(--white); border-radius:6px; padding:8px 16px; font-family:inherit; font-weight:600; font-size:13px; cursor:pointer; color:var(--ink); }
  .flash-controls { display:flex; gap:10px; }

  /* text/audio */
  .passage { font-size:16px; line-height:1.9; background:var(--paper); border:1px solid var(--border); border-radius:8px; padding:20px; }
  .passage mark { background:rgba(198,138,46,.28); color:var(--ink); padding:1px 3px; border-radius:3px; font-weight:600; }
  mark.mark-alt { background:rgba(87,44,28,.18); color:var(--teal-dark); }
  .audio-note { margin-top:12px; font-size:12px; color:var(--ink-soft); }
  .dialogue-wrap { display:flex; flex-direction:column; gap:10px; }
  .bubble-row { display:flex; }
  .bubble-row.right { justify-content:flex-end; }
  .bubble { max-width:75%; padding:10px 14px; border-radius:14px; font-size:15px; line-height:1.5; border:1px solid var(--border); }
  .bubble.left { background:var(--paper); border-bottom-left-radius:4px; }
  .bubble.right { background:var(--paper-2); border-bottom-right-radius:4px; }
  .bubble-speaker { display:block; font-family:'Fraunces',serif; font-weight:600; font-size:11px; color:var(--gold-dark); margin-bottom:3px; text-transform:uppercase; letter-spacing:.04em; }
  .bubble mark { background:rgba(198,138,46,.28); color:var(--ink); padding:1px 3px; border-radius:3px; font-weight:600; }

  /* grammar */
  .grammar-explain { font-size:15px; line-height:1.7; margin-bottom:18px; }
  .example-card { background:var(--paper); border:1px solid var(--border); border-left:4px solid var(--gold); border-radius:6px; padding:12px 14px; margin-bottom:10px; font-size:15px; }
  .example-card mark { background:rgba(31,111,92,.18); color:var(--teal-dark); padding:1px 3px; border-radius:3px; font-weight:600; }
  .pattern-line { display:flex; justify-content:space-between; align-items:center; gap:14px; background:var(--paper-2); border:1px solid var(--border); border-radius:8px; padding:14px 16px; margin-bottom:8px; flex-wrap:wrap; }
  .pattern-label { font-size:13px; color:var(--ink-soft); font-weight:600; }
  .pattern-value { font-family:'Fraunces',serif; font-weight:700; font-size:19px; color:var(--teal-dark); }

  /* controlled activity */
  .quiz-opt { display:block; width:100%; text-align:left; padding:11px 13px; border:1px solid var(--border); border-radius:8px; background:var(--paper); font-family:inherit; font-size:14px; cursor:pointer; color:var(--ink); margin-bottom:8px; }
  .quiz-opt.correct { background:rgba(46,125,79,.15); border-color:var(--ok); }
  .quiz-opt.incorrect { background:rgba(180,72,58,.12); border-color:var(--err); }
  .fib-sentence { font-family:'Fraunces',serif; font-size:18px; line-height:1.8; margin-bottom:6px; }
  .fib-input { border:none; border-bottom:2px solid var(--teal); background:transparent; font-family:'Fraunces',serif; font-size:18px; font-weight:600; color:var(--teal-dark); width:130px; text-align:center; }
  .fib-input.correct { border-color:var(--ok); color:var(--ok); }
  .fib-input.incorrect { border-color:var(--err); color:var(--err); }
  .fib-feedback { font-size:13px; margin:10px 0; min-height:18px; }
  .fib-feedback.ok { color:var(--ok); }
  .fib-feedback.err { color:var(--err); }
  .creation-model { background:var(--paper); border:1px dashed var(--teal); border-radius:8px; padding:14px; font-size:14px; margin-bottom:14px; }
  .creation-model b { color:var(--teal-dark); }
  textarea.answer-box { width:100%; min-height:90px; border:1px solid var(--border); border-radius:8px; padding:12px; font-family:inherit; font-size:14px; resize:vertical; background:var(--paper); color: var(--ink); }

  /* free practice */
  .practice-block { margin-bottom:20px; }
  .practice-block h3 { font-family:'Fraunces',serif; font-size:15px; margin:0 0 8px; color:var(--teal-dark); }
  .mystery-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:12px; }
  .mystery-card { position:relative; aspect-ratio:1; border-radius:8px; overflow:hidden; border:1px solid var(--border); }
  .mystery-num { position:absolute; bottom:4px; right:4px; background:var(--ink); color:var(--white); font-family:'Fraunces',serif; font-weight:700; font-size:13px; width:22px; height:22px; border-radius:50%; display:flex; align-items:center; justify-content:center; }

  /* recap */
  .recap-item { margin-bottom:16px; }
  .recap-item label { display:block; font-weight:600; font-size:14px; margin-bottom:6px; }
  .recap-answer { margin-top:8px; background:var(--paper); border:1px solid var(--border); border-left:4px solid var(--teal); border-radius:6px; padding:10px 13px; font-size:14px; color:var(--ink); }
  .chunk-pill { display:inline-block; background:var(--paper-2); border:1px solid var(--border); border-radius:999px; padding:5px 12px; font-size:12px; margin:0 6px 6px 0; }

  /* conclusion */
  .conclusion-box { text-align:center; padding:20px 0; }
  .conclusion-box .big { font-family:'Fraunces',serif; font-size:22px; margin-bottom:10px; }
  .chunk-recap-wrap { margin-top:18px; padding-top:18px; border-top:1px solid var(--border); }

  /* teacher notes */
  .teacher-mode-btn { border:1px solid var(--border); background:var(--white); border-radius:999px; padding:6px 14px; font-family:inherit; font-weight:600; font-size:12px; cursor:pointer; color:var(--ink-soft); white-space:nowrap; }
  .teacher-mode-btn.on { background:var(--gold); color:var(--ink); border-color:var(--gold-dark); }
  .teacher-notes { margin-top:22px; padding-top:16px; border-top:2px dashed var(--gold-dark); }
  .teacher-notes-label { font-family:'Fraunces',serif; font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--gold-dark); margin-bottom:6px; display:flex; align-items:center; gap:6px; }
  .teacher-notes-body,
  .teacher-notes-input,
  .teacher-image-input { background:#FFF7E8; border:1px solid var(--gold); border-radius:8px; padding:12px 14px; font-size:13px; color:var(--ink); line-height:1.6; font-family:inherit; width:100%; resize:vertical; }
  .teacher-image-input { padding:9px 12px; }

  /* unscramble */
  .unscramble-answer { min-height:52px; border:2px dashed var(--border); border-radius:8px; padding:10px; display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
  .unscramble-bank { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  .unscramble-word { background:var(--paper-2); border:1px solid var(--border); border-radius:6px; padding:8px 14px; font-family:'Fraunces',serif; font-weight:600; font-size:15px; cursor:pointer; color:var(--ink); }
  .unscramble-word.placed { opacity:.35; cursor:default; }
  .unscramble-answer .unscramble-word { background:var(--white); }
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="title-block">
      <h1 id="lessonTitle">Daily Routines &amp; Present Simple</h1>
      <div class="topic" id="lessonSubtitle">Aula estruturada em 8 passos</div>
      <div class="topic" id="lessonCanDo" style="font-style:italic;"></div>
    </div>
    <div class="level-badge" id="levelBadge">B1</div>
    <button class="teacher-mode-btn" id="teacherModeToggle">👁️ Modo professor: OFF</button>
  </header>

  <details class="setup">
    <summary>Configurar aula</summary>
    <div class="setup-grid">
      <div class="field">
        <label for="cefrSelect">Nível CEFR</label>
        <select id="cefrSelect">
          <option value="A0">A0</option>
          <option value="A1">A1</option>
          <option value="A2">A2</option>
          <option value="B1" selected>B1</option>
          <option value="B2">B2</option>
        </select>
      </div>
      <div class="field">
        <label>Modalidade</label>
        <div class="mode-toggle">
          <button id="modeIndividual" class="active">Individual</button>
          <button id="modeDupla">Dupla</button>
        </div>
      </div>
      <div class="field">
        <label for="studentA">Nome do aluno(a)</label>
        <input type="text" id="studentA" value="Aluno(a)" />
      </div>
      <div class="field" id="studentBField" style="display:none;">
        <label for="studentB">Nome do 2º aluno(a)</label>
        <input type="text" id="studentB" value="Aluno(a) 2" />
      </div>
    </div>
  </details>

  <div class="panel" id="panel"></div>

  <div class="nav-row">
    <button class="btn btn-ghost" id="prevBtn">← Back</button>
    <button class="btn btn-primary" id="nextBtn">Next →</button>
  </div>

</div>

      "You're sick today. You need to send your doctor's note to work.",

    teacherNotes: "Use uma imagem de escritório com uns 4 rostos diferentes. Student A escolhe uma pessoa como 'boss' e descreve com a linguagem da aula anterior (He's tall. He has short dark hair. He has a beard. / She's short. She has long curly hair. She has brown eyes.). Student B escuta e identifica ('Is it number 3?'). Depois trocam. RETRIEVAL BOX: WHAT DOES HE/SHE LOOK LIKE? → PHYSICAL APPEARANCE — IS: tall/short — HAS: long hair/short hair/curly hair/straight hair/a beard/brown eyes. BRIDGE: depois que o parceiro identifica o chefe: 'Great! Now you know what he/she LOOKS LIKE.' Depois: 'But... what's he/she LIKE?' — use essa pergunta pra introduzir o foco de hoje."

const STEP_NAMES = ["Warm Up","Chunks","Chunks in Use","Grammar","Controlled Practice","Free Practice","Recap","Conclusion"];

const state = {
  step: 0,
  mode: 'individual',
  teacherMode: false,
  studentA: 'Aluno(a)',
  studentB: 'Aluno(a) 2',
  flashIndex: 0,
  flashFlipped: false,
  flashTurn: 'A',
  fibIndex: 0,
  fibChecked: false,
  quizIndex: 0,
  quizAnswered: false,
  unscrambleIndex: 0,
  unscrambleBank: [],
  unscrambleAnswer: [],
  unscrambleChecked: false,
};

const $ = (s) => document.querySelector(s);
const panel = $('#panel');

function levelColor(cefr) { return { A1:'#4F8F6E', A2:'#3E7FA8', B1:'#1F6F5C', B2:'#6B5B95' }[cefr] || '#1F6F5C'; }
function isBasic() { return LESSON.cefr === 'A0' || LESSON.cefr === 'A1' || LESSON.cefr === 'A2'; }
function highlight(str) { return str.replace(/\[\[(.+?)\]\]/g, '<mark>$1</mark>').replace(/\{\{(.+?)\}\}/g, '<mark class="mark-alt">$1</mark>'); }
function turnName(t) { return t === 'A' ? state.studentA : state.studentB; }
// Aceita tanto uma URL de foto quanto um ícone SVG (string começando com "<svg")
// mode "fill" = preenche o card todo (flashcards); mode "inline" = tamanho fixo (warm-up)
function mediaHTML(value, mode) {
  if (!value) return '';
  const isSvg = value.trim().startsWith('<svg');
  if (mode === 'inline') {
    return isSvg
      ? `<div style="width:180px;height:180px;">${value}</div>`
      : `<img src="${value}" style="max-width:220px;border-radius:10px;">`;
  }
  return isSvg
    ? `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;">${value}</div>`
    : `<img src="${value}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:contain;border-radius:12px;">`;
}
function turnHTML(t) {
  if (state.mode !== 'dupla') return '';
  const cls = t === 'A' ? 'turn-a' : 'turn-b';
  return `<div class="turn-indicator ${cls}"><span class="turn-dot"></span> Turn: ${turnName(t)}</div>`;
}

// Só entra no HTML (nem existe no DOM) quando o modo professor está ativo —
// assim, com o modo desligado, o aluno não consegue ver nem inspecionando a página.
function teacherNotesHTML(notes, ref) {
  if (!state.teacherMode) return '';
  return `<div class="teacher-notes">
    <div class="teacher-notes-label">👁️ Notas do professor (só você vê)</div>
    <textarea class="teacher-notes-input" data-ref="${ref}" rows="2" placeholder="Write a note to yourself...">${notes || ''}</textarea>
  </div>`;
}

function getByRef(ref) {
  let obj = LESSON;
  ref.split('.').forEach(p => { obj = obj[p]; });
  return obj;
}

function bindTeacherInputs() {
  document.querySelectorAll('.teacher-notes-input').forEach(el => {
    el.oninput = () => { getByRef(el.dataset.ref).teacherNotes = el.value; };
  });
  const RERENDER_FNS = {
    warmup: stepWarmup,
    chunks: stepChunks,
    chunksInUse: stepChunksInUse,
    freePractice: stepFreePractice,
  };
  document.querySelectorAll('.teacher-image-input').forEach(el => {
    el.onchange = () => {
      getByRef(el.dataset.ref)[el.dataset.field || 'image'] = el.value;
      (RERENDER_FNS[el.dataset.rerender] || stepWarmup)();
    };
  });
}

function teacherImageHTML(currentUrl, ref, rerenderFn, field, label) {
  if (!state.teacherMode) return '';
  field = field || 'image';
  return `<div class="teacher-notes" style="border-top-style:dashed;">
    <div class="teacher-notes-label">🖼️ ${label || 'URL da foto'} (só você vê este campo)</div>
    <input type="text" class="teacher-image-input" data-ref="${ref}" data-rerender="${rerenderFn}" data-field="${field}" value="${currentUrl || ''}" placeholder="Cole a URL da imagem aqui...">
  </div>`;
}

function applyMeta() {
  $('#lessonTitle').textContent = LESSON.title;
  $('#lessonSubtitle').textContent = LESSON.subtitle;
  $('#lessonCanDo').textContent = LESSON.canDo ? ('Can do: ' + LESSON.canDo) : '';
  $('#levelBadge').textContent = LESSON.cefr;
  $('#levelBadge').style.background = levelColor(LESSON.cefr);
}

function renderProgress() {
  $('#prevBtn').disabled = state.step === 0;
  $('#nextBtn').textContent = state.step === 7 ? 'Finish class ✓' : 'Next →';
}

/* ---------- Step renderers ---------- */
function stepWarmup() {
  const w = LESSON.warmup;
  if (w.type === 'situation') {
    panel.innerHTML = `
      <div class="slide-kicker">${w.kicker}</div>
      <div class="slide-title">Set the scene</div>
      <div class="flash-wrap" style="margin-bottom:10px;">
        ${w.image ? mediaHTML(w.image, 'inline') : `<div class="flash-icon" style="font-size:80px;">${w.icon || ''}</div>`}
      </div>
      <ul class="q-list">${w.lines.map(l => `<li>${l}</li>`).join('')}</ul>
      ${teacherImageHTML(w.image, "warmup", "warmup")}
      ${teacherNotesHTML(w.teacherNotes, "warmup")}
    `;
    bindTeacherInputs();
    return;
  }
  panel.innerHTML = `
    <div class="slide-kicker">${w.kicker}</div>
    <div class="slide-title">Let's Get Started</div>
    <div class="slide-sub">${state.mode === 'dupla' ? 'Conversem em dupla sobre as perguntas abaixo.' : 'Pense e responda em voz alta.'}</div>
    <ul class="q-list">${w.questions.map(q => `<li>${q}</li>`).join('')}</ul>
    ${teacherNotesHTML(w.teacherNotes, "warmup")}
  `;
  bindTeacherInputs();
}

function stepChunks() {
  const c = LESSON.chunks[state.flashIndex];
  const basic = isBasic();
  const qaMode = LESSON.chunksMode === 'qa';
  panel.innerHTML = `
    <div class="slide-kicker">Chunks</div>
    <div class="slide-title">Chunks</div>
    ${turnHTML(state.flashTurn)}
    <div class="flash-wrap">
      <div class="flash-progress">Chunk ${state.flashIndex + 1} de ${LESSON.chunks.length}</div>
      <div class="flashcard ${state.flashFlipped ? 'flipped' : ''}" id="fc">
        <div class="flashcard-inner">
          <div class="flash-face flash-front">
            ${qaMode
              ? `<div class="flash-word" style="font-size:19px;">${c.word}</div>`
              : (basic
                  ? (c.image ? mediaHTML(c.image) : `<div class="flash-icon">${c.icon}</div>`)
                  : `<div class="flash-word">${c.word}</div>`)}
          </div>
          <div class="flash-face flash-back">
            ${qaMode
              ? `<div class="meaning">${c.meaningEN}</div>`
              : (basic
                  ? `<div class="flash-word" style="font-size:22px;">${c.word}</div>`
                  : `<div class="meaning">${c.meaningEN}</div><div class="example">${c.example}</div>`)}
          </div>
        </div>
      </div>
      <div class="flash-hint">${qaMode ? 'Click to reveal the model answer' : (basic ? 'Click to reveal the word' : 'Click to reveal the meaning')}</div>
      <div class="flash-controls">
        <button class="flash-nav" id="fPrev">← Previous</button>
        <button class="flash-nav" id="fNext">Next →</button>
      </div>
    </div>
    ${teacherImageHTML(c.image, "chunks." + state.flashIndex, "chunks")}
    ${teacherNotesHTML(c.teacherNotes, "chunks." + state.flashIndex)}
  `;
  $('#fc').onclick = () => { state.flashFlipped = !state.flashFlipped; stepChunks(); };
  $('#fPrev').onclick = (e) => { e.stopPropagation(); nav(-1); };
  $('#fNext').onclick = (e) => { e.stopPropagation(); nav(1); };
  bindTeacherInputs();
  function nav(d) {
    state.flashIndex = (state.flashIndex + d + LESSON.chunks.length) % LESSON.chunks.length;
    state.flashFlipped = false;
    if (state.mode === 'dupla') state.flashTurn = state.flashTurn === 'A' ? 'B' : 'A';
    stepChunks();
  }
}

function stepChunksInUse() {
  const cu = LESSON.chunksInUse;
  if (cu.type === 'dialogue') {
    const speakers = [...new Set(cu.lines.map(l => l.speaker))];
    panel.innerHTML = `
      <div class="slide-kicker">${cu.kicker}</div>
      <div class="slide-title">${cu.title || 'Chunks in Context'}</div>
      <div class="dialogue-wrap">
        ${cu.lines.map(l => {
          const side = l.speaker === speakers[0] ? 'left' : 'right';
          return `<div class="bubble-row ${side}">
            <div class="bubble ${side}"><span class="bubble-speaker">${l.speaker}</span>${highlight(l.text)}</div>
          </div>`;
        }).join('')}
      </div>
      <div class="audio-note">🔊 ${cu.audioNote}</div>
      ${teacherNotesHTML(cu.teacherNotes, "chunksInUse")}
    `;
    bindTeacherInputs();
    return;
  }
  panel.innerHTML = `
    <div class="slide-kicker">${cu.kicker}</div>
    <div class="slide-title">Chunks in Context</div>
    ${cu.image ? `<img src="${cu.image}" style="max-width:100%;border-radius:10px;margin-bottom:16px;">` : ''}
    <div class="passage">${highlight(cu.passage)}</div>
    <div class="audio-note">🔊 ${cu.audioNote}</div>
    ${teacherImageHTML(cu.image, "chunksInUse", "chunksInUse")}
    ${teacherNotesHTML(cu.teacherNotes, "chunksInUse")}
  `;
  bindTeacherInputs();
}

function stepGrammar() {
  const g = LESSON.grammar;
  panel.innerHTML = `
    <div class="slide-kicker">${g.kicker}</div>
    <div class="slide-title">${g.title}</div>
    <div class="grammar-explain">${g.explanation}</div>
    ${g.examples.map((ex, i) => `
      <div class="example-card">
        <div style="margin-bottom:8px;">${highlight(ex.text)}</div>
        <div class="grammar-guess" data-i="${i}" data-answer="${ex.answer}">
          <button class="quiz-opt" data-choice="appearance" style="display:inline-block;width:auto;margin:0 8px 0 0;">👀 Appearance</button>
          <button class="quiz-opt" data-choice="personality" style="display:inline-block;width:auto;margin:0;">💭 Personality</button>
        </div>
      </div>
    `).join('')}
    ${g.pattern ? `
      <button class="btn btn-ghost" id="patternReveal" style="margin-top:12px;">Show pattern</button>
      <div id="patternBox" style="display:none;margin-top:12px;">
        ${g.pattern.map(p => `
          <div class="pattern-line">
            <span class="pattern-label">${p.label}</span>
            <span class="pattern-value">${p.value}</span>
          </div>
        `).join('')}
      </div>
    ` : ''}
    ${teacherNotesHTML(g.teacherNotes, "grammar")}
  `;
  document.querySelectorAll('.grammar-guess').forEach(wrap => {
    const answer = wrap.dataset.answer;
    wrap.querySelectorAll('button').forEach(btn => {
      btn.onclick = () => {
        if (wrap.dataset.answered) return;
        wrap.dataset.answered = '1';
        wrap.querySelectorAll('button').forEach(b => {
          if (b.dataset.choice === answer) b.classList.add('correct');
          else if (b === btn) b.classList.add('incorrect');
          b.disabled = true;
        });
      };
    });
  });
  if (g.pattern) {
    $('#patternReveal').onclick = () => {
      $('#patternBox').style.display = 'block';
      $('#patternReveal').style.display = 'none';
    };
  }
  bindTeacherInputs();
}

function stepControlled() {
  const ctrl = LESSON.controlled;
  if (ctrl.type === 'fillblanks') return stepFib();
  if (ctrl.type === 'quiz') return stepQuiz();
  if (ctrl.type === 'unscramble') return stepUnscramble();
  return stepCreation();
}

function stepFib() {
  const items = LESSON.controlled.fillblanks;
  if (state.fibIndex >= items.length) {
    panel.innerHTML = `
      <div class="slide-kicker">${LESSON.controlled.kicker}</div>
      <div class="slide-title">Activity Completed!</div>
      <p>All sentences answered. Use "Back" to review, or move on to Free Practice.</p>
      <button class="btn btn-ghost" id="fibRestart">Try again</button>
    `;
    $('#fibRestart').onclick = () => { state.fibIndex = 0; state.fibChecked = false; stepFib(); };
    return;
  }
  const item = items[state.fibIndex];
  const parts = item.sentence.split('___');
  panel.innerHTML = `
    <div class="slide-kicker">${LESSON.controlled.kicker}</div>
    <div class="slide-title">Fill in the blanks</div>
    <div class="flash-progress" style="margin-bottom:12px;">Sentence ${state.fibIndex + 1} of ${items.length}</div>
    <div class="fib-sentence">${parts[0]}<input type="text" class="fib-input" id="fibInput" autocomplete="off">${parts[1] || ''}</div>
    <button class="btn btn-ghost" id="fibCheck" style="margin-top:14px;">Check</button>
    <div class="fib-feedback" id="fibFeedback"></div>
    ${teacherNotesHTML(LESSON.controlled.teacherNotes, "controlled")}
  `;
  bindTeacherInputs();
  const input = $('#fibInput');
  input.focus();
  input.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
  $('#fibCheck').onclick = check;
  function check() {
    if (state.fibChecked) { state.fibIndex++; state.fibChecked = false; stepFib(); return; }
    state.fibChecked = true;
    const ok = input.value.trim().toLowerCase() === item.answer.toLowerCase();
    input.classList.add(ok ? 'correct' : 'incorrect');
    input.disabled = true;
    $('#fibFeedback').textContent = ok ? 'Correct!' : `The right answer is "${item.answer}".`;
    $('#fibFeedback').className = 'fib-feedback ' + (ok ? 'ok' : 'err');
    $('#fibCheck').textContent = 'Next →';
  }
}

function stepQuiz() {
  const items = LESSON.controlled.quiz;
  if (state.quizIndex >= items.length) {
    panel.innerHTML = `
      <div class="slide-kicker">${LESSON.controlled.kicker}</div>
      <div class="slide-title">Quiz Completed!</div>
      <button class="btn btn-ghost" id="qRestart">Try again</button>
    `;
    $('#qRestart').onclick = () => { state.quizIndex = 0; state.quizAnswered = false; stepQuiz(); };
    return;
  }
  const q = items[state.quizIndex];
  panel.innerHTML = `
    <div class="slide-kicker">${LESSON.controlled.kicker}</div>
    <div class="slide-title">Quiz</div>
    <div class="flash-progress" style="margin-bottom:12px;">Question ${state.quizIndex + 1} of ${items.length}</div>
    <div style="font-family:'Fraunces',serif;font-size:17px;font-weight:600;margin-bottom:14px;">${q.question}</div>
    ${q.options.map((o, i) => `<button class="quiz-opt" data-i="${i}">${o}</button>`).join('')}
    ${teacherNotesHTML(LESSON.controlled.teacherNotes, "controlled")}
  `;
  bindTeacherInputs();
  document.querySelectorAll('.quiz-opt').forEach(btn => {
    btn.onclick = () => {
      if (state.quizAnswered) return;
      state.quizAnswered = true;
      const chosen = parseInt(btn.dataset.i);
      document.querySelectorAll('.quiz-opt').forEach((b, i) => {
        if (i === q.correct) b.classList.add('correct');
        else if (i === chosen) b.classList.add('incorrect');
        b.disabled = true;
      });
      setTimeout(() => { state.quizIndex++; state.quizAnswered = false; stepQuiz(); }, 900);
    };
  });
}

function stepCreation() {
  const c = LESSON.controlled.creation;
  panel.innerHTML = `
    <div class="slide-kicker">${LESSON.controlled.kicker}</div>
    <div class="slide-title">Guided Creation</div>
    <div class="creation-model">${c.model}</div>
    <div class="slide-sub">${c.prompt}</div>
    <textarea class="answer-box" placeholder="Write here..."></textarea>
    ${teacherNotesHTML(LESSON.controlled.teacherNotes, "controlled")}
  `;
  bindTeacherInputs();
}

function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function stepUnscramble() {
  const items = LESSON.controlled.unscramble;
  if (state.unscrambleIndex >= items.length) {
    panel.innerHTML = `
      <div class="slide-kicker">${LESSON.controlled.kicker}</div>
      <div class="slide-title">Activity Completed!</div>
      <button class="btn btn-ghost" id="unsRestart">Try again</button>
    `;
    $('#unsRestart').onclick = () => { state.unscrambleIndex = 0; state.unscrambleChecked = false; stepUnscramble(); };
    return;
  }
  const item = items[state.unscrambleIndex];
  if (state.unscrambleBank.length === 0 && state.unscrambleAnswer.length === 0) {
    state.unscrambleBank = shuffleArray(item.sentence.split(' '));
  }

  panel.innerHTML = `
    <div class="slide-kicker">${LESSON.controlled.kicker}</div>
    <div class="slide-title">Unscramble</div>
    <div class="flash-progress" style="margin-bottom:14px;">Sentence ${state.unscrambleIndex + 1} of ${items.length} — put the words in the right order</div>
    <div class="unscramble-answer" id="unsAnswer">
      ${state.unscrambleAnswer.map((w, i) => `<span class="unscramble-word" data-i="${i}" data-zone="answer">${w}</span>`).join('')}
    </div>
    <div class="unscramble-bank" id="unsBank">
      ${state.unscrambleBank.map((w, i) => `<span class="unscramble-word" data-i="${i}" data-zone="bank">${w}</span>`).join('')}
    </div>
    <button class="btn btn-ghost" id="unsCheck">Check</button>
    <div class="fib-feedback" id="unsFeedback"></div>
    ${teacherNotesHTML(LESSON.controlled.teacherNotes, "controlled")}
  `;
  bindTeacherInputs();

  document.querySelectorAll('#unsBank .unscramble-word').forEach(el => {
    el.onclick = () => {
      const i = parseInt(el.dataset.i);
      state.unscrambleAnswer.push(state.unscrambleBank[i]);
      state.unscrambleBank.splice(i, 1);
      stepUnscramble();
    };
  });
  document.querySelectorAll('#unsAnswer .unscramble-word').forEach(el => {
    el.onclick = () => {
      const i = parseInt(el.dataset.i);
      state.unscrambleBank.push(state.unscrambleAnswer[i]);
      state.unscrambleAnswer.splice(i, 1);
      stepUnscramble();
    };
  });
  $('#unsCheck').onclick = () => {
    const built = state.unscrambleAnswer.join(' ');
    const ok = built.toLowerCase().replace(/[?.!]/g, '') === item.sentence.toLowerCase().replace(/[?.!]/g, '');
    const fb = $('#unsFeedback');
    if (ok) {
      fb.textContent = 'Correct!';
      fb.className = 'fib-feedback ok';
      setTimeout(() => {
        state.unscrambleIndex++;
        state.unscrambleBank = [];
        state.unscrambleAnswer = [];
        stepUnscramble();
      }, 900);
    } else {
      fb.textContent = 'Not quite — try reordering the words.';
      fb.className = 'fib-feedback err';
    }
  };
}

function stepFreePractice() {
  const fp = LESSON.freePractice;
  panel.innerHTML = `
    <div class="slide-kicker">${fp.kicker}</div>
    <div class="slide-title">Free Practice</div>
    ${turnHTML(state.flashTurn)}
    <div class="practice-block">
      <h3>✍️ Writing</h3>
      ${fp.mysteryPeople ? `<div class="mystery-grid">${fp.mysteryPeople.map(p => `
        <div class="mystery-card">
          <img src="${p.image}" style="width:100%;height:100%;object-fit:cover;">
          <span class="mystery-num">${p.n}</span>
        </div>`).join('')}</div>` : ''}
      ${fp.image1 ? `<img src="${fp.image1}" style="max-width:100%;border-radius:10px;margin-bottom:10px;">` : ''}
      <p style="font-size:15px;white-space:pre-line;">${fp.writingPrompt}</p>
      ${teacherImageHTML(fp.image1, "freePractice", "freePractice", "image1", "URL da foto (Which Person)")}
    </div>
    <div class="practice-block">
      <h3>🗣️ Speaking</h3>
      ${fp.image2 ? `<img src="${fp.image2}" style="max-width:100%;border-radius:10px;margin-bottom:10px;">` : ''}
      <p style="font-size:14px;">${fp.speakingPrompt}</p>
      ${teacherImageHTML(fp.image2, "freePractice", "freePractice", "image2", "URL da foto (Family Party)")}
    </div>
    ${teacherNotesHTML(fp.teacherNotes, "freePractice")}
  `;
  bindTeacherInputs();
}

function stepRecap() {
  const r = LESSON.recap;
  panel.innerHTML = `
    <div class="slide-kicker">${r.kicker}</div>
    <div class="slide-title">Recap</div>
    ${r.questions.map((item, i) => `
      <div class="recap-item">
        <label>${item.q}</label>
        <button class="btn btn-ghost recap-reveal-btn" data-i="${i}">Show answer</button>
        <div class="recap-answer" id="recapAnswer${i}" style="display:none;"></div>
      </div>`).join('')}
    <div class="chunk-recap-wrap">
      <div style="font-size:12px;color:var(--ink-soft);margin-bottom:8px;">Today's chunks:</div>
      ${LESSON.chunks.map(c => `<span class="chunk-pill">${c.word}</span>`).join('')}
    </div>
    ${teacherNotesHTML(r.teacherNotes, "recap")}
  `;
  document.querySelectorAll('.recap-reveal-btn').forEach(btn => {
    btn.onclick = () => {
      const i = btn.dataset.i;
      const box = $('#recapAnswer' + i);
      box.textContent = r.questions[i].a;
      box.style.display = 'block';
      btn.style.display = 'none';
    };
  });
  bindTeacherInputs();
}

function stepConclusion() {
  panel.innerHTML = `
    <div class="conclusion-box">
      <div class="slide-kicker">Conclusion</div>
      <div class="big">I'm glad to have you here!</div>
      <p>See you next class 👋</p>
    </div>
  `;
}

const RENDERERS = [stepWarmup, stepChunks, stepChunksInUse, stepGrammar, stepControlled, stepFreePractice, stepRecap, stepConclusion];

function renderStep() {
  renderProgress();
  RENDERERS[state.step]();
}

$('#prevBtn').onclick = () => { if (state.step > 0) { state.step--; renderStep(); } };
$('#nextBtn').onclick = () => { if (state.step < 7) { state.step++; renderStep(); } };

$('#modeIndividual').onclick = () => setMode('individual');
$('#modeDupla').onclick = () => setMode('dupla');
function setMode(m) {
  state.mode = m;
  $('#modeIndividual').classList.toggle('active', m === 'individual');
  $('#modeDupla').classList.toggle('active', m === 'dupla');
  $('#studentBField').style.display = m === 'dupla' ? 'block' : 'none';
  renderStep();
}
$('#studentA').addEventListener('input', e => { state.studentA = e.target.value || 'Aluno(a)'; renderStep(); });
$('#studentB').addEventListener('input', e => { state.studentB = e.target.value || 'Aluno(a) 2'; renderStep(); });
$('#cefrSelect').addEventListener('change', e => { LESSON.cefr = e.target.value; applyMeta(); renderStep(); });

$('#teacherModeToggle').onclick = () => {
  state.teacherMode = !state.teacherMode;
  $('#teacherModeToggle').textContent = state.teacherMode ? '👁️ Modo professor: ON' : '👁️ Modo professor: OFF';
  $('#teacherModeToggle').classList.toggle('on', state.teacherMode);
  renderStep();
};

$('#cefrSelect').value = LESSON.cefr;
applyMeta();
renderStep();
</script>
</body>
</html>
