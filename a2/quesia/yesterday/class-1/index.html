<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Yesterday · Class 1 · In the Morning</title>
  <style>
    :root{--cream:#fff8e8;--brown:#4b2e1f;--yellow:#c78a18;--soft:#f3d98b}
    *{box-sizing:border-box} body{margin:0;background:var(--cream);color:var(--brown);font-family:Nunito,Arial,sans-serif;min-height:100vh;display:grid;place-items:center}
    main{width:min(100vw,1280px);padding:14px}.stage{position:relative;background:#000;border-radius:18px;overflow:hidden;box-shadow:0 18px 45px #4b2e1f33;aspect-ratio:16/9}
    img{width:100%;height:100%;object-fit:contain;display:block}.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px}
    button,a{border:0;border-radius:999px;padding:11px 18px;font-weight:800;font-size:15px;text-decoration:none;cursor:pointer}button{background:var(--brown);color:#fff}button:disabled{opacity:.35;cursor:not-allowed}.next{background:var(--yellow);color:#fff}.count{font-weight:900;min-width:70px;text-align:center}.hint{font-size:13px;opacity:.75;text-align:center;margin-top:7px}@media(max-width:650px){main{padding:6px}.bar{gap:5px}button,a{padding:9px 12px;font-size:13px}.hint{display:none}}
  </style>
</head>
<body>
  <main>
    <div class="stage"><img id="slide" src="slide-1.jpg" alt="Lesson slide 1"></div>
    <div class="bar"><button id="prev" type="button">← Previous</button><span class="count" id="count">1 / 12</span><button id="next" type="button">Next →</button><a class="next" href="../class-2/">Class 2</a></div>
    <div class="hint">Use ← → on the keyboard. Press F for full screen.</div>
  </main>
  <script>
    const total=12;let current=1;const image=document.querySelector('#slide'),count=document.querySelector('#count'),prev=document.querySelector('#prev'),next=document.querySelector('#next');
    function show(n){current=Math.max(1,Math.min(total,n));image.src=`slide-${current}.jpg`;image.alt=`Lesson slide ${current}`;count.textContent=`${current} / ${total}`;prev.disabled=current===1;next.disabled=current===total}
    prev.onclick=()=>show(current-1);next.onclick=()=>show(current+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')show(current+1);if(e.key==='ArrowLeft')show(current-1);if(e.key.toLowerCase()==='f')document.querySelector('.stage').requestFullscreen?.()});show(1);
  </script>
</body>
</html>
